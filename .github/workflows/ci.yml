name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in SKILL.md README.md ARCHITECTURE.md LICENSE; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done

      - name: Check SKILL.md frontmatter
        run: |
          head -1 SKILL.md | grep -q '^---' || { echo "::error::SKILL.md must start with YAML frontmatter"; exit 1; }
          awk '/^---$/{n++; next} n==1{print}' SKILL.md > /tmp/fm.yml
          grep -q '^name:' /tmp/fm.yml || { echo "::error::frontmatter missing name"; exit 1; }
          grep -q '^description:' /tmp/fm.yml || { echo "::error::frontmatter missing description"; exit 1; }
          echo "SKILL.md frontmatter OK"

  git-regression:
    name: Git contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run deterministic Git and dataset checks (not model evals)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
